version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - backend/.env.example
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bank"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ub-network

  backend:
    build:
      context: ./backend
    env_file:
      - backend/.env.example
    environment:
      APP_PORT: 5001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SYNCHRONIZE: false
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm run migrate && npm run seed && node dist/src/main.js"
    networks:
      - ub-network

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5001/api
        NEXT_PUBLIC_APP_NAME: Universal Bank LMS
    env_file:
      - frontend/.env.example
    environment:
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - backend
    networks:
      - ub-network

volumes:
  postgres-data:

networks:
  ub-network:
    driver: bridge