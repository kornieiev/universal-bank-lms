version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - backend/.env.development
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bank"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ub-network

  backend:
    build:
      context: ./backend
    env_file:
      - backend/.env.development
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SYNCHRONIZE: false
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm run migrate && npm run seed && node dist/src/main.js"
    networks:
      - ub-network

  frontend:
    build:
      context: ./frontend
    env_file:
      - frontend/.env.development
    environment:
      NODE_ENV: production
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - ub-network

volumes:
  postgres-data:

networks:
  ub-network:
    driver: bridge